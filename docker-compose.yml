services:
  vaporburn:
    build:
      context: .
      dockerfile: Dockerfile
    image: ghcr.io/theretrogeekyt-dev/vaporburn:latest
    container_name: vaporburn
    restart: unless-stopped
    ports:
      - "8081:8081"                # Web UI accessible at http://<nas-ip>:8081
    environment:
      - PUID=1000                  # Host User ID
      - PGID=1000                  # Host Group ID
      - UMASK=002                  # Ensures group-writable permissions
      - PORT=8081                  # Web server port
    volumes:
      # Mount your VaporFetch /downloads folder here (read-only for security)
      - /mnt/storage/games:/input:ro
      # Target directory where generated .iso and .sha256 files will be saved
      - /mnt/storage/installers:/output
      # Persistent app data (job history, settings)
      - ./data:/app/data
